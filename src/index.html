<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'none'; font-src 'none'; object-src 'none'; media-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A vendor-neutral, animated explanation of Wi-Fi 7 and how it improves on earlier Wi-Fi, told through healthcare stories.">
  <title>Wi-Fi 7 Explained</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="present.css">
</head>
<body>
  <a class="skip-link" href="#slide">Skip to the slide</a>

  <header role="banner" class="site-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        <span class="brand-title">Wi-Fi 7 Explained</span>
        <span class="brand-sub">A healthcare story</span>
      </span>
    </div>
    <div class="header-controls">
      <div class="menu">
        <button id="chapter-menu-toggle" class="chip-button" type="button" aria-expanded="false" aria-controls="chapter-menu">Chapters</button>
        <nav id="chapter-menu" class="menu-panel" aria-label="Chapters" hidden>
          <ol id="chapter-list" class="chapter-list"></ol>
        </nav>
      </div>
      <div id="audience" class="segmented" role="radiogroup" aria-label="Audience"></div>
      <div class="menu">
        <button id="settings-toggle" class="chip-button" type="button" aria-expanded="false" aria-controls="settings-menu">Settings</button>
        <div id="settings-menu" class="menu-panel settings-panel" hidden>
          <button id="theme-toggle" class="menu-item" type="button">Theme: System</button>
          <button id="motion-toggle" class="menu-item" type="button" aria-pressed="true">Motion: On</button>
          <button id="present-toggle" class="menu-item" type="button">Full screen</button>
          <button id="shortcuts-toggle" class="menu-item" type="button" aria-haspopup="dialog">Keyboard shortcuts</button>
        </div>
      </div>
    </div>
  </header>

  <main id="panel" class="panel" tabindex="-1">
    <section id="slide" class="slide" aria-label="Slide" tabindex="-1">
      <div id="stage" class="stage"></div>
      <div id="caption" class="caption" aria-live="polite" hidden></div>
      <canvas id="transition-frame" class="transition-frame" aria-hidden="true" hidden></canvas>
      <section id="opener" class="opener" aria-live="polite" aria-labelledby="opener-title" hidden></section>
      <aside id="callout" class="callout" aria-live="polite" aria-label="Callout" hidden></aside>
      <div id="hotspot-card" class="hotspot-card" role="dialog" aria-modal="false" aria-labelledby="hotspot-card-title" data-overlay hidden></div>
      <p id="scene-description" class="visually-hidden" aria-live="polite"></p>
      <div class="slide-bar">
        <p id="stage-notice" class="notice stage-notice" hidden></p>
        <div id="compare" class="compare"></div>
        <div id="controls" class="controls"></div>
        <div class="progress-strip">
          <p id="progress" class="progress"></p>
          <div class="progress-track" aria-hidden="true"><span id="progress-fill" class="progress-fill"></span></div>
        </div>
      </div>
    </section>

    <aside id="notes" class="notes" aria-label="Notes for this step" hidden>
      <div class="notes-header">
        <h2 class="notes-title">Notes</h2>
        <button id="notes-close" class="control" type="button">Close notes</button>
      </div>
      <div id="lineage"></div>
      <article id="story" class="story"></article>
      <div id="bottom-line"></div>
      <div id="deep"></div>
      <section class="scene-description" aria-labelledby="notes-description-title">
        <h3 id="notes-description-title">What the animation shows</h3>
        <p id="notes-description"></p>
      </section>
      <div id="figures"></div>
      <div id="scenario"></div>
      <div id="extra"></div>
    </aside>
  </main>

  <div id="announcer" class="visually-hidden" aria-live="polite"></div>
  <div id="blank" class="blank-overlay" hidden></div>

  <noscript>
    <p class="noscript">This explainer needs JavaScript to show its slides and animations. Please enable JavaScript, or open the site in a current browser.</p>
  </noscript>

  <script defer src="app.js"></script>
</body>
</html>
